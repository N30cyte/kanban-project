<section class="column" id="column-{{ column.id }}" data-column-id="{{ column.id }}">
  {% include "partials/column_header.html" %}
  <div class="cards" id="cards-{{ column.id }}">
    {% for card in column.cards %}
    {% include "partials/card.html" %}
    {% endfor %}
  </div>
  {% if not column.is_complete %}
  <form class="card-form" hx-post="/columns/{{ column.id }}/cards" hx-target="#cards-{{ column.id }}" hx-swap="beforeend">
    <input type="text" name="title" placeholder="New card" required>
    <button type="submit">+ Add Card</button>
  </form>
  {% endif %}
</section>
